name: 작업 (메인테이너)
description: 메인테이너가 계획한 작업을 정해진 형식으로 올립니다. 버그 제보와 기능 제안은 다른 양식을 써 주세요.
title: '[작업] '
labels: ['task']
body:
  - type: markdown
    attributes:
      value: |
        이슈 하나가 PR 하나 크기가 되도록 나눠 주세요. 제목은 `[작업] <한 줄 요약>` 형식이고, 제목에 이모지는 쓰지 않습니다. 예: `[작업] 툴바 아이콘에 미제출 개수 배지 표시`

  - type: dropdown
    id: kind
    attributes:
      label: 종류
      options:
        - 기능
        - 버그 수정
        - 리팩터링
        - 테스트
        - 조사
        - 문서
        - 설정, 도구, CI
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      multiple: true
      options:
        - KLAS API 계층
        - background (캐시, 메시지)
        - 알림
        - 툴바 배지
        - KLAS 탭
        - content script (KLAS 화면)
        - MAIN world 스크립트
        - 빌드, CI
        - 문서
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 이 작업이 필요한지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 작업 단위로 체크리스트를 적어 주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 리뷰어가 이 조건으로 완료 여부를 판단합니다. 확인할 수 있는 형태로 적어 주세요.
      placeholder: |
        - 4가지 날짜 형식 단위 테스트 통과
        - Chrome에서 로드했을 때 배지에 미제출 개수가 보임
    validations:
      required: true

  - type: textarea
    id: dom
    attributes:
      label: 대상 화면과 DOM 발췌
      description: |
        영역에 "content script (KLAS 화면)"을 골랐으면 반드시 채웁니다. 이 칸이 비면 Claude 구현을 시작하지 않습니다.
        화면 경로와, 고칠 부분의 DOM을 적어 주세요. `tests/fixtures/klas/dom/<페이지 이름>.html` 경로를 적거나,
        `npm run fixtures:dom-snippet`으로 만든 익명화 HTML을 붙입니다(방법은 tests/fixtures/klas/README.md "화면 DOM 발췌").
        학번, 이름, 과목명이 남은 원본 HTML은 붙이지 않습니다.
      placeholder: |
        화면: /std/lis/evltn/OnlineCntntsStdPage.do
        DOM: tests/fixtures/klas/dom/online-lectures.html

  - type: input
    id: depends
    attributes:
      label: 선행 이슈
      description: 이 작업 전에 끝나야 하는 이슈가 있으면 적어 주세요.
      placeholder: '#2, #5'

  - type: textarea
    id: out-of-scope
    attributes:
      label: 이번에 하지 않는 것
      description: 범위가 커지지 않도록, 관련 있지만 이 이슈에서 다루지 않을 내용을 적어 주세요.

  - type: textarea
    id: refs
    attributes:
      label: 참고
      description: 관련 문서 절, 디자인 시안 링크, KLAS API 경로, 기존 KLAS Helper 코드 위치 등

  - type: checkboxes
    id: flags
    attributes:
      label: 해당 사항
      options:
        - label: KLAS 로그인 없이 테스트만으로 확인할 수 있습니다. (good first issue 후보)
        - label: manifest 권한이 바뀝니다.
        - label: 새 KLAS API를 씁니다. (docs/ARCHITECTURE.md의 API 목록 갱신 필요)
        - label: 기존 KLAS Helper 코드를 가져옵니다. (LICENSE에 원 저작권 표시 추가 필요)
