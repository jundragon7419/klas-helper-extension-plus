# 기능 PR 본문의 "릴리스 전 Firefox 확인 필요" 체크에 맞춰 firefox-check 라벨을 붙이거나 지운다.
# 릴리스 PR 양식(.github/PULL_REQUEST_TEMPLATE/release.md)이 이 라벨로 Firefox에서 확인할 PR을 모은다.
# 판단은 scripts/ci/firefox-check.js. 절차는 CONTRIBUTING.md "배포"에 있다.
name: Firefox label

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    # fork PR의 토큰은 라벨을 바꿀 수 없다. 메인테이너가 직접 붙인다.
    # 닫힌 PR은 릴리스에서 확인을 마치고 라벨을 지웠을 수 있으므로 건드리지 않는다.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      # 판단 코드는 기본 브랜치에서 읽는다.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/github-script@v7
        with:
          script: |
            const script = `${process.env.GITHUB_WORKSPACE}/scripts/ci/firefox-check.js`;
            // 이 워크플로를 추가하는 PR에서는 기본 브랜치에 판단 코드가 아직 없다.
            if (!require('fs').existsSync(script)) return core.notice('기본 브랜치에 firefox-check.js가 없어 건너뜁니다.');
            const { FIREFOX_LABEL, needsFirefoxCheck } = await import(script);
            const pr = context.payload.pull_request;
            const want = needsFirefoxCheck(pr.body);
            const has = pr.labels.some((l) => l.name === FIREFOX_LABEL);
            core.info(`#${pr.number}: Firefox 확인 ${want ? '필요' : '불필요'}, 라벨 ${has ? '있음' : '없음'}`);
            if (want && !has) {
              await github.rest.issues.createLabel({ ...context.repo, name: FIREFOX_LABEL, color: 'E66000',
                description: '릴리스 전 Firefox에서 직접 확인할 PR' }).catch(() => {});
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [FIREFOX_LABEL] });
            }
            if (!want && has) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: FIREFOX_LABEL });
            }
