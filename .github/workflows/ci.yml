name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # edited: PR 본문의 "Closes #N"을 고친 뒤에도 브랜치 검사를 다시 한다.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# 같은 PR에서 새 실행이 시작되면 이전 실행을 멈춘다. develop, main push는 멈추지 않는다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 규칙은 CONTRIBUTING.md "브랜치" 절. 브랜치 이름과 본문은 env로 넘겨 셸에 직접 넣지 않는다.
      - name: 브랜치 이름 검사
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/ci/check-branch.js

      - name: 의존성 설치
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 포맷 검사
        run: npm run format:check

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 빌드 (Chrome)
        run: npm run build

      - name: 빌드 (Firefox)
        run: npm run build:firefox

      # manifest가 참조하는 파일, background 형식, 권한 스냅샷을 브라우저 없이 검사한다.
      - name: 빌드 산출물 검사
        run: npm run check:build

      # 경고는 통과시키고 오류만 실패로 본다.
      - name: Firefox 확장 검사
        run: npm run lint:firefox

  # 빌드한 확장을 Chromium에 올리고, 가짜 KLAS 화면(DOM fixture와 API fixture)에서 content script를 확인한다.
  # Chromium이 Chrome과 Edge를 대표한다. 머지 게이트(ai-gate)가 check와 함께 이 작업의 성공을 요구한다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드 (Chrome)
        run: npm run build

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: E2E (Chromium)
        run: npm run test:e2e

      # 테스트마다 남긴 화면 스크린샷과 실패 기록. PR의 Checks 화면에서 내려받는다.
      - name: E2E 스크린샷과 기록 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            playwright-report/
            test-results/
          retention-days: 14
