name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # edited: PR 본문의 "Closes #N"을 고친 뒤에도 브랜치 검사를 다시 한다.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# 같은 PR에서 새 실행이 시작되면 이전 실행을 멈춘다. develop, main push는 멈추지 않는다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 규칙은 CONTRIBUTING.md "브랜치" 절. 브랜치 이름과 본문은 env로 넘겨 셸에 직접 넣지 않는다.
      - name: 브랜치 이름 검사
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/ci/check-branch.js

      - name: 의존성 설치
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 포맷 검사
        run: npm run format:check

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 빌드 (Chrome)
        run: npm run build

      - name: 빌드 (Firefox)
        run: npm run build:firefox

      # manifest가 참조하는 파일, background 형식, 권한 스냅샷을 브라우저 없이 검사한다.
      - name: 빌드 산출물 검사
        run: npm run check:build

      # 경고는 통과시키고 오류만 실패로 본다.
      - name: Firefox 확장 검사
        run: npm run lint:firefox

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      # 빌드한 확장을 Chromium에 올려 background가 실행되는지 확인한다. Chrome과 Edge를 대표한다.
      - name: E2E (Chromium)
        run: npm run test:e2e

      - name: E2E 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
